apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
    team: {{ .Values.team }}
spec:
  replicas: {{ .Values.api.replicas }}
  # новые поды поднимаем до удаления старых: сервис не теряет мощность при обновлении
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        team: {{ .Values.team }}
    spec:
      containers:
        - name: api
          image: {{ .Values.api.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          env:
            # секрет с готовым адресом БД создаёт оператор (<имя кластера>-app)
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.name }}-app
                  key: uri
            - name: HEALTH_FAIL
              value: {{ .Values.api.healthFail | quote }}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
