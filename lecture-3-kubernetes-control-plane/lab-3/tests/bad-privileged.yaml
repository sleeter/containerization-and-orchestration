apiVersion: v1
kind: Pod
metadata:
  name: bad-privileged
  namespace: shop
  labels:
    app: demo
    team: shop
spec:
  containers:
    - name: app
      image: shop/api:0.1
      resources:
        requests: {cpu: 50m, memory: 32Mi}
        limits: {cpu: 100m, memory: 64Mi}
      securityContext:
        privileged: true
