apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: shop
  labels:
    team: {{ .Values.team }}
spec:
  groups:
    - name: shop.rules
      rules:
        # 1. Пользователи получают 5xx: доля ошибок api > 5% дольше 2 минут (и трафик не нулевой)
        - alert: ShopApiHighErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}", job="api", status=~"5.."}[2m]))
              / sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}", job="api"}[2m])) > 0.05
            and sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}", job="api"}[2m])) > 0.05
          for: 2m
          labels: {severity: critical, team: {{ .Values.team }}}
          annotations:
            summary: "shop api: доля 5xx выше 5% больше 2 минут"
        # 2. Нет ни одного готового пода Postgres: /order и /orders не работают, а /health зелёный
        - alert: ShopDatabaseNotReady
          expr: |
            (sum(kube_pod_status_ready{namespace="{{ .Release.Namespace }}", condition="true", pod=~"{{ .Values.db.name }}-[0-9]+"}) or vector(0)) < 1
          for: 1m
          labels: {severity: critical, team: {{ .Values.team }}}
          annotations:
            summary: "shop: нет ни одного готового пода postgres"
        # 3. Воркер не работает: заказы принимаются, но не обрабатываются
        - alert: ShopWorkerDown
          expr: absent(up{namespace="{{ .Release.Namespace }}", job="worker"} == 1)
          for: 1m
          labels: {severity: critical, team: {{ .Values.team }}}
          annotations:
            summary: "shop: нет ни одного живого пода worker, заказы не обрабатываются"
    - name: shop.network
      rules:
        # 4. Сеть режет трафик: политики отбрасывают пакеты дольше 2 минут.
        # В покое отказов почти нет, поэтому устойчивый поток POLICY_DENIED означает
        # либо сломанное правило (легитимный трафик режется), либо кто-то лезет туда, куда не положено
        - alert: ShopNetworkPolicyDrops
          expr: sum(rate(hubble_drop_total{reason="POLICY_DENIED"}[2m])) > 0.5
          for: 2m
          labels: {severity: critical, team: {{ .Values.team }}}
          annotations:
            summary: "сеть: политики отбрасывают пакеты (POLICY_DENIED) больше 2 минут"
        # 5. Клиент не может установить соединение с api: доля успешных запросов ниже 99%
        - alert: ShopClientConnectionsFailing
          expr: |
            sum(rate(loadgen_requests_total{result="ok"}[1m]))
              / sum(rate(loadgen_requests_total[1m])) < 0.99
            and sum(rate(loadgen_requests_total[1m])) > 0
          for: 1m
          labels: {severity: critical, team: {{ .Values.team }}}
          annotations:
            summary: "сеть: клиент не может достучаться до api (успешных запросов меньше 99%)"
        # 6. DNS не работает: CoreDNS перестал получать запросы (его не достают) или отвечает ошибками
        - alert: ShopDnsBroken
          expr: |
            sum(rate(coredns_dns_requests_total[2m])) < 1
            or (sum(rate(coredns_dns_responses_total{rcode=~"SERVFAIL|REFUSED"}[2m]))
                / sum(rate(coredns_dns_requests_total[2m])) > 0.05)
          for: 2m
          labels: {severity: critical, team: {{ .Values.team }}}
          annotations:
            summary: "сеть: DNS не работает (нет запросов к CoreDNS или SERVFAIL/REFUSED выше 5%)"
