apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: api
    team: {{ .Values.team }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: http
      {{- if eq .Values.api.service.type "NodePort" }}
      nodePort: {{ .Values.api.service.nodePort }}
      {{- end }}
