# два подопытных пода на разных нодах для Части 1: по ним смотрим eth0, veth и связность между нодами
apiVersion: v1
kind: Pod
metadata:
  name: net-a
  namespace: shop
  labels: {app: netcheck, team: shop}
spec:
  nodeName: minikube
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 32Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: net-b
  namespace: shop
  labels: {app: netcheck, team: shop}
spec:
  nodeName: minikube-m02
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 32Mi}
