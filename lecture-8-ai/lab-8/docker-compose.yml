name: lab8

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      TZ: Europe/Moscow
      GENERIC_TIMEZONE: Europe/Moscow
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_METRICS: "true"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
