apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.db.name }}
  labels:
    app: postgres
    team: {{ .Values.team }}
spec:
  priorityClassName: {{ .Values.priority.critical.name }}
  instances: {{ .Values.db.instances }}
  # метки для подов, которые создаёт оператор: без них политика require-labels их отклонит
  inheritedMetadata:
    labels:
      app: postgres
      team: {{ .Values.team }}
  storage:
    size: {{ .Values.db.storage }}
  resources:
    {{- toYaml .Values.db.resources | nindent 4 }}
