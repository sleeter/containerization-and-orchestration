apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .Values.priority.critical.name }}
value: {{ .Values.priority.critical.value }}
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "Critical shop API and PostgreSQL"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .Values.priority.batch.name }}
value: {{ .Values.priority.batch.value }}
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "Background shop batch workload"
