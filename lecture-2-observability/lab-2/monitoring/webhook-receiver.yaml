# получатель алертов: эхо-сервер, печатает тело каждого webhook в stdout
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-logger
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: {app: webhook-logger}
  template:
    metadata:
      labels: {app: webhook-logger}
    spec:
      containers:
        - name: echo
          image: mendhak/http-https-echo:34
          ports:
            - {containerPort: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-logger
  namespace: monitoring
spec:
  selector: {app: webhook-logger}
  ports:
    - {port: 8080, targetPort: 8080}
