apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: api
spec:
  groups:
    - name: api.rules
      rules:
        # 1. Пользователи получают 5xx: доля ошибок > 5% дольше 2 минут (и трафик не нулевой)
        - alert: ApiHighErrorRate
          expr: |
            sum(rate(http_request_errors_total{namespace="demo"}[2m]))
              / sum(rate(http_requests_total{namespace="demo"}[2m])) > 0.05
            and sum(rate(http_requests_total{namespace="demo"}[2m])) > 0.05
          for: 2m
          labels: {severity: critical, app: api}
          annotations:
            summary: "api: доля 5xx выше 5% больше 2 минут"
        # 2. Пользователи ждут: p95 времени ответа > 1s дольше 2 минут
        - alert: ApiHighLatencyP95
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_request_duration_seconds_bucket{namespace="demo"}[2m]))) > 1
          for: 2m
          labels: {severity: critical, app: api}
          annotations:
            summary: "api: p95 времени ответа выше 1s больше 2 минут"
        # 3. Сервис не отвечает вовсе: ни одной живой цели скрейпа
        - alert: ApiDown
          expr: absent(up{namespace="demo", job="api"} == 1)
          for: 1m
          labels: {severity: critical, app: api}
          annotations:
            summary: "api: нет ни одного живого пода (цель Prometheus down или пропала)"
